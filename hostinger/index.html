<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Official Hostinger 1-Click n8n Cloud ($6.49/mo)...</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function() {
      // MASTER AFFILIATE TARGET LINK (Swap this 1 line to your Impact.com link once approved!)
      var base = "https://www.hostinger.com/vps/n8n-hosting";
      var p = new URLSearchParams(window.location.search);
      var ep = (p.get("ep") || "direct").replace(/[^a-zA-Z0-9_-]/g, "");
      var src = (p.get("src") || p.get("s") || "").replace(/[^a-zA-Z0-9_-]/g, "");
      if (!src) {
        var ref = (document.referrer || "").toLowerCase();
        if (ref.indexOf("youtube.com") !== -1 || ref.indexOf("youtu.be") !== -1) src = "yt_direct";
        else if (ref.indexOf("google.") !== -1) src = "google_seo";
        else if (ref.indexOf("github.com") !== -1) src = "github";
        else src = "hub";
      }
      var geo = (p.get("geo") || "").replace(/[^a-zA-Z0-9_-]/g, "");
      if (!geo) {
        try {
          var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
          var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC").split("/").pop().replace(/[^a-zA-Z0-9_-]/g, "");
          geo = lang + "_" + tz;
        } catch (e) {
          geo = "en";
        }
      }
      var cta = (p.get("cta") || "btn").replace(/[^a-zA-Z0-9_-]/g, "");
      var sid = [ep, src, geo, cta].join("__").slice(0, 64);
      var out = new URLSearchParams();
      out.set("utm_source", "360rev");
      out.set("utm_medium", src);
      out.set("utm_campaign", ep);
      out.set("utm_content", cta + "_" + geo);
      out.set("subId1", ep);
      out.set("subId2", src);
      out.set("subId3", geo);
      out.set("subId4", cta);
      out.set("sid", sid);
      var dest = base + "?" + out.toString();
      window.location.replace(dest);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://www.hostinger.com/vps/n8n-hosting?utm_source=360rev">
  </noscript>
</head>

</body>
